name: Set up Playwright
description: >
  Chromium for Playwright, with the browser download cached by Playwright version. On a cache
  hit only the system libraries are installed (apt), which is much faster than a full install.
runs:
  using: composite
  steps:
    - id: version
      shell: bash
      run: echo "playwright=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
    - id: cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-chromium-${{ runner.os }}-${{ steps.version.outputs.playwright }}
    - if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: pnpm exec playwright install --with-deps chromium
    - if: steps.cache.outputs.cache-hit == 'true'
      shell: bash
      run: pnpm exec playwright install-deps chromium

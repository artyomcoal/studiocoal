name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Started by "Update visual snapshots" after it commits new baselines (pushes made with
  # GITHUB_TOKEN don't trigger workflows on their own).
  workflow_dispatch:

# Public Sanity identifiers (not secrets), needed by astro.config.mjs and the Sanity CLI.
env:
  PUBLIC_SANITY_PROJECT_ID: bw6geomj
  PUBLIC_SANITY_DATASET: production

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Check, lint, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - name: Generated Sanity types are up to date
        run: pnpm typegen && git diff --exit-code src/sanity/types.ts
      - run: pnpm build

  e2e:
    name: Playwright (smoke, visual, axe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/setup-playwright
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

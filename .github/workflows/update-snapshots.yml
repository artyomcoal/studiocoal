# Regenerates the linux visual baselines (CI compares against these) and commits them to the
# PR branch, then re-runs CI on that commit and removes the label.
# Trigger: add the `update-snapshots` label to a PR (or run manually on a branch).
# Review the new images in the PR's "Files changed" tab (GitHub shows image diffs).
name: Update visual snapshots

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

# Public Sanity identifiers (not secrets), needed by astro.config.mjs and the Sanity CLI.
env:
  PUBLIC_SANITY_PROJECT_ID: bw6geomj
  PUBLIC_SANITY_DATASET: production

permissions:
  contents: write # commit the baselines
  pull-requests: write # remove the label
  actions: write # start CI on the new commit

concurrency:
  group: update-snapshots-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  update:
    # Labelled PRs from this repository only (a fork's branch can't be pushed to).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.label.name == 'update-snapshots' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    env:
      BRANCH: ${{ github.head_ref || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          # .nvmrc says "22": take the newest 22.x, not whatever the runner has cached
          # (a cached 22.23.3 failed Astro's ">=22.23.4" check).
          check-latest: true
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/setup-playwright
      - run: pnpm exec playwright test visual --update-snapshots=all

      - name: Commit changed baselines
        id: commit
        run: |
          git add tests/e2e/__screenshots__/linux
          if git diff --cached --quiet; then
            echo "Baselines unchanged."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git commit -m "test: update linux visual baselines" -m "Generated by the Update visual snapshots workflow."
            git push origin "HEAD:$BRANCH"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Re-run CI on the new commit
        if: steps.commit.outputs.changed == 'true'
        run: gh workflow run ci.yml --ref "$BRANCH"

      - name: Remove the label
        if: always() && github.event_name == 'pull_request'
        run: gh pr edit "${{ github.event.pull_request.number }}" --remove-label update-snapshots

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: linux-snapshots
          path: tests/e2e/__screenshots__/linux/
          retention-days: 7
